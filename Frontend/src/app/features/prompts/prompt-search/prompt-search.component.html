<div class="chat-layout" [class.chat-started]="hasStarted">
  <!-- Initial Prompt Form -->
  <div *ngIf="!hasStarted" class="initial-prompt">
    <h3>How does your story begin?</h3>
    <div class="chat-input-form">
      <textarea [(ngModel)]="newPromptText"
                placeholder="Start your story..."
                class="chat-input"
                rows="3"></textarea>
      <button (click)="createPrompt()" class="send-button">Begin</button>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="messages-container" #chatMessages>
    <div *ngFor="let message of messages" 
         [ngClass]="{'message': true, 'user-message': message.isUser, 'bot-message': !message.isUser}">
      {{ message.text }}
    </div>
  </div>

  <!-- Chat Input -->
  <div *ngIf="hasStarted" class="chat-input-container">
    <div class="chat-input-form">
      <input type="text" 
             [(ngModel)]="newPromptText"
             placeholder="Type your message..."
             class="chat-input"
             (keyup.enter)="createPrompt()">
      <button (click)="createPrompt()" 
              class="send-button"
              [disabled]="isLoading">
        Send
      </button>
    </div>
  </div>

  <app-loading-indicator [isLoading]="isLoading"></app-loading-indicator>
  <app-error-message [error]="error"></app-error-message>
</div>
