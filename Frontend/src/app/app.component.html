<div class="chat-container">
  <div class="chat-header">
    <h2>{{ title }}</h2>
    <button class="theme-toggle" (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <span class="theme-icon">{{ isDarkMode ? '☀️' : '🌙' }}</span>
    </button>
  </div>

  <!-- Initial Prompt View -->
  <div class="story-prompt" *ngIf="!isChatMode">
    <h1>How does your story begin?</h1>
    <div class="prompt-container">
      <textarea 
        class="form-input" 
        placeholder="Start your story..." 
        [(ngModel)]="storyPrompt"
        [class.error]="error"
        (keydown)="onKeyDown($event)"
      ></textarea>
      <div *ngIf="error" class="error-message">{{ error }}</div>
      <div class="story-controls">
        <div class="limit-selector">
          <label for="iterationLimit">Story Length:</label>
          <select 
            id="iterationLimit" 
            [(ngModel)]="iterationLimit" 
            class="limit-select">
            <option [ngValue]="2">Short (2)</option>
            <option [ngValue]="3">Medium (3)</option>
            <option [ngValue]="4">Long (4)</option>
            <option [ngValue]="5">Epic (5)</option>
          </select>
        </div>
        <button 
          class="begin-button" 
          (click)="onBegin()" 
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Begin</span>
          <span *ngIf="isLoading">Starting...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat View -->
  <div class="chat-view" *ngIf="isChatMode">
    <div class="messages-container" #messagesContainer>
      <div *ngFor="let message of messages; let i = index">
        <!-- Regular messages -->
        <div *ngIf="!message.isOption" 
             class="message" 
             [class.user-message]="message.isUser"
             [class.bot-message]="!message.isUser"
             [class.recap-message]="message.isRecap">
          {{ message.text }}
        </div>
        
        <!-- Options container -->
        <div *ngIf="isFirstOption(message, i)" 
             class="options-container">
          <ng-container *ngFor="let option of getOptionsSlice(i)">
            <div *ngIf="option.isOption"
                 class="message option-message"
                 [class.selected-option]="option.isSelected"
                 [class.disabled-option]="option.disabled"
                 (click)="selectOption(option)"
                 [style.cursor]="getCursorStyle(option)">
              {{ option.text }}
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    <div class="chat-input-container">
      <textarea 
        #chatInput
        class="chat-input" 
        placeholder="Type your response..." 
        [(ngModel)]="storyPrompt"
        (keydown)="onKeyDown($event)"
      ></textarea>
      <button class="send-button" 
        [disabled]="!storyPrompt.trim()"
        (click)="onSend()">
        Send
      </button>
    </div>
  </div>
</div>
