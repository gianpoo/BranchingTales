<div class="container">
  <h2>Contributors List</h2>

  <button (click)="fetchContributors()" class="fetch-button">
    Fetch Contributors
  </button>

  <div *ngIf="isLoading" class="loading">
    <p>Loading contributors...</p>
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <table *ngIf="showContributors && !isLoading && !error && contributors.length > 0" class="contributors-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone Number</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let contributor of contributors">
        <td>{{ contributor.id }}</td>
        <td>{{ contributor.name }}</td>
        <td>{{ contributor.phoneNumber }}</td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="showContributors && !isLoading && !error && contributors.length === 0" class="no-contributors">
    <p>No contributors found.</p>
  </div>
</div>
